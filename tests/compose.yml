services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: business_os_test
      POSTGRES_DB: business_os_test
    ports: ["127.0.0.1:55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 30
  s3:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: business_os_test
      MINIO_ROOT_PASSWORD: business_os_test_secret
    ports: ["127.0.0.1:59000:9000"]
